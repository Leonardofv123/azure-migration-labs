# CI dos testes Pester.
#
# Os testes verificam higiene do repositorio: sintaxe dos scripts,
# ausencia de segredos versionados, estrutura dos labs e convencoes de
# documentacao. Nao provisionam nada no Azure, entao nao exigem
# credenciais nem geram custo.

name: pester-tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pester:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -PassThru | Select-Object Name, Version

      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true

          Invoke-Pester -Configuration $config
